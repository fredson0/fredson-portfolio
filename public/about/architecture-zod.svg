<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <rect width="320" height="200" fill="#1e1e1e" rx="8"/>
  <text x="16" y="28" fill="#6a9955" font-family="ui-monospace, monospace" font-size="11">// lib/contact/schema.ts</text>
  <text x="16" y="52" fill="#9cdcfe" font-family="ui-monospace, monospace" font-size="12">contactFormSchema</text>
  <text x="16" y="72" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="12">  .object({</text>
  <text x="16" y="92" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="12">    name: z.string().min(2),</text>
  <text x="16" y="112" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="12">    email: z.string().email(),</text>
  <text x="16" y="132" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="12">    message: z.string().min(10),</text>
  <text x="16" y="152" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="12">  })</text>
  <text x="16" y="178" fill="#569cd6" font-family="ui-monospace, monospace" font-size="11">Zod · validação na borda</text>
