<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="Schema Zod de validacao do formulario de contato">
  <rect width="320" height="200" fill="#ffffff"/>

  <text x="160" y="18" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Fluxo de valida&#231;&#227;o (Zod)</text>

  <!-- Input parallelogram -->
  <polygon points="28,48 108,48 96,78 16,78" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="62" y="68" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">JSON</text>

  <line x1="108" y1="63" x2="128" y2="63" stroke="#111111" stroke-width="1.5"/>
  <polygon points="132,63 124,59 124,67" fill="#111111"/>

  <!-- Process -->
  <rect x="134" y="48" width="92" height="30" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="67" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">Zod parse</text>

  <line x1="180" y1="78" x2="180" y2="92" stroke="#111111" stroke-width="1.5"/>
  <polygon points="180,96 175,88 185,88" fill="#111111"/>

  <!-- Decision diamond -->
  <polygon points="180,100 220,128 180,156 140,128" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="132" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">v&#225;lido?</text>

  <!-- Yes -->
  <line x1="220" y1="128" x2="248" y2="128" stroke="#111111" stroke-width="1.5"/>
  <polygon points="252,128 244,124 244,132" fill="#111111"/>
  <text x="232" y="122" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="8">sim</text>
  <rect x="254" y="114" width="50" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="279" y="132" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">DTO</text>

  <!-- No -->
  <line x1="180" y1="156" x2="180" y2="168" stroke="#111111" stroke-width="1.5"/>
  <polygon points="180,172 175,164 185,164" fill="#111111"/>
  <text x="192" y="166" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="8">n&#227;o</text>
  <rect x="154" y="174" width="52" height="22" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="189" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">HTTP 400</text>
</svg>
